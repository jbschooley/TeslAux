# SPDX-License-Identifier: MIT
[package]
name    = "teslamic"
version = "0.1.0"
edition = "2021"
publish = false
description = "Heltec T114 (nRF52840) firmware that emulates Tesla's cabin microphone over USB (VID 1235:0002, USB Audio Class 1.0, 48 kHz / 16-bit / stereo) to make the car show the MIC overlay icon.  Experimental."

[[bin]]
name = "teslamic"
path = "src/main.rs"

[features]
# Default: enumerate as the mic AND stream silence out the iso endpoint.
default = ["stream"]
# Run the register-level iso pump (feed the endpoint). Without it the device
# only enumerates (teslamic-enum-only.uf2).
stream = []
# Emit a 1 kHz sine while the user button (P1_10) is held, silence otherwise
# (teslamic-sine.uf2). Implies `stream`.
sine-button = ["stream"]
# Add the TeslaMic HID interface (IF2, 8-byte interrupt IN) and stream a
# heartbeat, attempting to defeat the car's ~60 s "unsupported USB microphone"
# popup (teslamic-hid.uf2). Implies `stream`. Content is a guess pending a real
# mic capture — see README.
hid-heartbeat = ["stream"]
# While the button is held, step a tone through a log-spaced frequency table
# (50 Hz .. 20 kHz) on ALL channels, to map the car's mic-processing passband
# (teslamic-sweep.uf2). Implies `stream`.
sweep = ["stream"]
# Log every USB control request the host (car) sends to the onboard ST7789 TFT,
# in real time — turns the T114 into its own USB analyzer to reverse-engineer
# the HID handshake behind the "unsupported mic" popup. Implies `hid-heartbeat`
# (so the HID interface exists for the car to talk to).
usb-spy = [
    "hid-heartbeat",
    "dep:embedded-graphics",
    "dep:embedded-graphics-core",
    "dep:embedded-hal",
    "dep:embedded-hal-async",
    "dep:heapless",
    "dep:critical-section",
]

# Versions pinned to exactly what is already in the local cargo cache so the
# project builds fully offline.  Do not loosen these without a network to
# fetch fresh transitive deps.
[dependencies]
embassy-nrf = { version = "=0.10.0", features = [
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "nfc-pins-as-gpio",
    # Exposes `embassy_nrf::pac` so the silence pump can drive the USBD ISOIN
    # registers directly (the high-level driver can't write iso endpoints).
    "unstable-pac",
] }
embassy-usb      = { version = "=0.6.0", default-features = false }
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time     = { version = "=0.5.1" }
embassy-futures  = { version = "=0.1.2" }

cortex-m    = { version = "=0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "=0.7.5"

# ── usb-spy feature deps (onboard-TFT USB control-request logger) ────────────
embedded-graphics      = { version = "=0.8.2", optional = true }
embedded-graphics-core = { version = "=0.4.1", optional = true }
embedded-hal           = { version = "=1.0.0", optional = true }
embedded-hal-async     = { version = "=1.0.0", optional = true }
heapless               = { version = "=0.8.0", optional = true }
critical-section       = { version = "=1.2.0", optional = true }

# Size-optimised even in dev: the app must fit the 0x26000-based flash window
# and there is no reason to ship a fat debug build for a USB descriptor blob.
[profile.dev]
opt-level       = "s"
overflow-checks = true

[profile.release]
opt-level     = "s"
lto           = "fat"
codegen-units = 1
