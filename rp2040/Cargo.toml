# SPDX-License-Identifier: MIT
[package]
name    = "teslamic-rp"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "RP2040 TeslaMic emulator + USB audio source bridge. `car` faces the Tesla, `source` faces the phone."

# Car-facing: clones the TeslaMic, captures I2S, streams the iso IN endpoint.
# This is the ONLY binary needed for the PCM2706 build.
[[bin]]
name = "car"
path = "src/bin/car.rs"

# Phone-facing: a UAC1 speaker advertising 48 kHz ONLY, re-emitting as I2S.
# Only needed for the two-board (clock-locked) build.
[[bin]]
name = "source"
path = "src/bin/source.rs"

# Synthetic USB drive: 20 silent tracks, so the car's own media player can act
# as a control surface. Standalone, so the mic stays a byte-for-byte clone.
[[bin]]
name = "usbdrive"
path = "src/bin/usbdrive.rs"

# Standalone WS2812 bring-up test: no USB, no audio, no tasks. See src/bin/ledtest.rs.
[[bin]]
name = "ledtest"
path = "src/bin/ledtest.rs"

# I2S bring-up: upstream embassy-rp I2S master, to test slave_rx against known
# good code. See src/bin/i2stest.rs.
[[bin]]
name = "i2stest"
path = "src/bin/i2stest.rs"

# Clock presence check on the car side: plain GPIO, no PIO, no USB.
[[bin]]
name = "i2ssniff"
path = "src/bin/i2ssniff.rs"

# slave_rx isolation test: real PIO program, no USB. See src/bin/i2srx.rs.
[[bin]]
name = "i2srx"
path = "src/bin/i2srx.rs"

[features]
default = []
# Board select. The RP2040-Zero has NO plain LED on GPIO25 — its only indicator
# is a WS2812 on GPIO16 — so status has to be driven over PIO1 instead of a
# GPIO. Everything else (Pico, RP2040-Plus) keeps the simple GPIO25 LED.
rp2040-zero = []
# Diagnostic: fill the synthetic drive's tracks with a tone instead of silence,
# so that a car which plays them can be heard doing so. Production wants
# silence — the real audio comes over the microphone endpoint.
audible = []
# Infer media-button presses from which track the car reads, and pace track
# reads so a pause is visible. Off by default: it works, but it reads a side
# effect of playback rather than the presses themselves, and ScreenMate can
# bind the buttons to its own playback directly. See MEDIA-CONTROLS.md.
detect = []
# Halve the source board's cushion: ring 512 instead of 1024, and a 32-frame I2S
# block instead of 64. Saves ~5 ms of ~130 ms end to end, so it is only worth
# using if it proves as reliable as the default — the deadband is set by how much
# the HOST bunches packets, and running closer to the floor leaves less room for
# a host that bunches more than iOS did on the day it was measured.
low-latency = []
# Steer the source board's I2S clock to follow the HOST, so the phone and the
# I2S link share one clock and there is only one clock crossing in the whole
# chain (at the car, absorbed losslessly by varying the packet size). This is
# what the design always intended; the default build gave it up to avoid
# unproven PIO. Uses `i2s_pio::master_tx` instead of upstream's fixed-rate
# driver, because upstream cannot retune its divider at runtime.
clock-steered = []
# Diagnostic: ignore USB entirely and emit a tone on the LEFT channel only,
# straight into the I2S slots. Isolates the I2S channel mapping from the host,
# the pipe and the car board's USB side. See src/bin/source.rs.
pan-test = []
# Diagnostic: track how far the buffer level actually wanders and colour the LED
# by the peak. That is the real lower bound on the cushion — everything else is
# inference. See src/bin/source.rs.
measure-excursion = []
# Source cushion at 2x the MEASURED peak excursion rather than an inferred bound:
# ring 256 (2.67 ms) with a 16-frame I2S block. Requires clock-steered — a
# free-running clock has drift to absorb as well as jitter, and its slip deadband
# would not fit this ring.
ultra-low = ["clock-steered"]
# Car board drives the I2S clock from the car's SOF and emits fixed-size
# packets (PaceMode::Locked). Requires the `source` board on the other end.
# Without it, the car board is an I2S slave to a PCM2706 and paces elastically.
clock-locked = []
# Add a mass-storage interface to the car-facing device: one silent track, so
# the car's media controls act on something harmless rather than on a phone
# connected over Bluetooth for calls.
#
# This changes the descriptor set the car validates, which is the whole reason
# the drive was a separate device until now. Off by default.
media-drive = []

# DIAGNOSTIC (car board): generate a 1 kHz tone internally and deliberately swing
# the iso packet size 47/49 every frame. Answers "does Tesla tolerate variable
# packet sizes?" with no PCM2706, no source board, no wiring — flash, plug into
# the car, listen. Clean tone => Elastic pacing is safe. Never ship this.
packet-stress = []

[dependencies]
embassy-rp       = { version = "0.9", features = ["rp2040", "time-driver", "critical-section-impl", "unstable-pac"] }
embassy-usb      = { version = "0.6", default-features = false }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time     = { version = "0.5" }
embassy-futures  = { version = "0.1" }
embassy-sync     = { version = "0.7" }

cortex-m    = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
pio          = "0.3"
pio-proc     = "0.3"
fixed        = "1"
# RGB8, for the RP2040-Zero's onboard WS2812 (it has no plain LED).
smart-leds   = "0.4"

[profile.release]
opt-level     = "s"
lto           = "fat"
codegen-units = 1
debug         = 2
