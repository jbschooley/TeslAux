# SPDX-License-Identifier: MIT
[package]
name    = "teslamic-rp"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "RP2040 TeslaMic emulator + USB audio source bridge. `car` faces the Tesla, `source` faces the phone."

# Car-facing: clones the TeslaMic, captures I2S, streams the iso IN endpoint.
# This is the ONLY binary needed for the PCM2706 build.
[[bin]]
name = "car"
path = "src/bin/car.rs"

# Phone-facing: a UAC1 speaker advertising 48 kHz ONLY, re-emitting as I2S.
# Only needed for the two-board (clock-locked) build.
[[bin]]
name = "source"
path = "src/bin/source.rs"

# Standalone WS2812 bring-up test: no USB, no audio, no tasks. See src/bin/ledtest.rs.
[[bin]]
name = "ledtest"
path = "src/bin/ledtest.rs"

# I2S bring-up: upstream embassy-rp I2S master, to test slave_rx against known
# good code. See src/bin/i2stest.rs.
[[bin]]
name = "i2stest"
path = "src/bin/i2stest.rs"

# Clock presence check on the car side: plain GPIO, no PIO, no USB.
[[bin]]
name = "i2ssniff"
path = "src/bin/i2ssniff.rs"

# slave_rx isolation test: real PIO program, no USB. See src/bin/i2srx.rs.
[[bin]]
name = "i2srx"
path = "src/bin/i2srx.rs"

[features]
default = []
# Board select. The RP2040-Zero has NO plain LED on GPIO25 — its only indicator
# is a WS2812 on GPIO16 — so status has to be driven over PIO1 instead of a
# GPIO. Everything else (Pico, RP2040-Plus) keeps the simple GPIO25 LED.
rp2040-zero = []
# Halve the source board's cushion: ring 512 instead of 1024, and a 32-frame I2S
# block instead of 64. Saves ~5 ms of ~130 ms end to end, so it is only worth
# using if it proves as reliable as the default — the deadband is set by how much
# the HOST bunches packets, and running closer to the floor leaves less room for
# a host that bunches more than iOS did on the day it was measured.
low-latency = []
# Steer the source board's I2S clock to follow the HOST, so the phone and the
# I2S link share one clock and there is only one clock crossing in the whole
# chain (at the car, absorbed losslessly by varying the packet size). This is
# what the design always intended; the default build gave it up to avoid
# unproven PIO. Uses `i2s_pio::master_tx` instead of upstream's fixed-rate
# driver, because upstream cannot retune its divider at runtime.
clock-steered = []
# Diagnostic: ignore USB entirely and emit a tone on the LEFT channel only,
# straight into the I2S slots. Isolates the I2S channel mapping from the host,
# the pipe and the car board's USB side. See src/bin/source.rs.
pan-test = []
# Diagnostic: track how far the buffer level actually wanders and colour the LED
# by the peak. That is the real lower bound on the cushion — everything else is
# inference. See src/bin/source.rs.
measure-excursion = []
# Source cushion at 2x the MEASURED peak excursion rather than an inferred bound:
# ring 256 (2.67 ms) with a 16-frame I2S block. Requires clock-steered — a
# free-running clock has drift to absorb as well as jitter, and its slip deadband
# would not fit this ring.
ultra-low = ["clock-steered"]
# Car board drives the I2S clock from the car's SOF and emits fixed-size
# packets (PaceMode::Locked). Requires the `source` board on the other end.
# Without it, the car board is an I2S slave to a PCM2706 and paces elastically.
clock-locked = []

# DIAGNOSTIC (car board): substitute a generated tone for the captured I2S
# samples, keeping the capture TIMING intact. The source board still drives the
# I2S clock, so the pipe's producer runs at exactly the rate it normally does and
# the pacer behaves normally — but the data is known, so any hold in a recording
# is this board's pipe running dry rather than one that arrived over I2S.
#
# This is what `packet-stress` cannot answer: that build writes its tone straight
# into the packet buffer and never touches the pipe at all, so it cannot produce
# a pipe underrun even if the pipe is the fault. Needs the source board connected
# and streaming. See src/bin/car.rs.
pipe-tone = []

# DIAGNOSTIC (car board): measure HOW the pipe empties, not just that it did.
# Samples the level once per USB packet and latches, on the first underrun,
# whether the fall before it was long and shallow (the pacer being out-argued)
# or short and steep (the producer stalling). Shown as a colour: green none,
# red a stall, amber in between, blue a gradual drain. Combine with pipe-tone to
# take the source board's data out of the picture. See src/bin/car.rs.
pipe-watch = []
# DIAGNOSTIC: advertise the real mic's full audio topology — Input 4 -> Feature
# Unit 5 -> Selector 6 -> Output 7 — instead of the bare Input -> Output pair
# this has always used. The real mic gets a volume control in the car's UI and
# this one does not, and the Feature Unit is the only thing that could be
# driving that. Answers the car's volume queries and counts them, so a run in
# the car says whether the car drives mic volume over USB at all.
feature-unit = []
# DIAGNOSTIC: report the Input Terminal as a Line Connector (0x0603) instead of
# a Microphone (0x0201). The car clamps ALL media output to about 60% whenever a
# CaraokeMic is enumerated — with both handhelds switched off, so it reacts to a
# microphone-class device being present, not to a live mic. Tesla calls it
# anti-howling. A line input has no acoustic path and no feedback risk, so if the
# clamp keys on terminal type, saying so should lift it.
line-in = []

# DIAGNOSTIC: keep a ring of the car's IF3 `A5 5A` writes so they can be read
# out. They have always been accepted and discarded — the car never reads back,
# so there was no reason to look. There is now: the car's mic, reverb and effect
# controls do nothing to this device and send nothing over the audio class,
# which leaves IF3 as the only channel they could be on.
if3-log = []
# DIAGNOSTIC: keep every descriptor, string and interface as the real mic's and
# change only the VID/PID. By elimination the last field that can carry
# recognition — terminal type, Feature Unit and IF3 have all been ruled out.
generic-id = []

# DIAGNOSTIC: omit IF3 entirely. It is what defeats the "unsupported USB
# microphone" popup and the descriptor the car validates, so this is the test
# that separates being accepted from being clamped: if audio still arrives, the
# identity alone is enough; if it stops, the two are the same event.
no-if3 = []

# DIAGNOSTIC: refuse the car's IF3 karaoke session frames (`FC 03 C0 AA 01/00`)
# while accepting the rest. Anti-howling clamps the car's entire output whenever
# a CaraokeMic is present; whether that engages on enumeration or on the karaoke
# session starting has never been separated. This declines the session while
# staying the device the car accepts audio from.
if3-nak-session = []
# The blunter version: refuse every IF3 write. Finds out whether the car needs
# any of that block or merely sends it.
if3-nak-all = []


# DIAGNOSTIC (with feature-unit): advertise a maximum volume of 0 dB instead of
# +30. The car sets the device to its advertised maximum at connect and never
# revisits it, so if the car scales its own mixer by what the mic claims it can
# do, claiming nothing should make it attenuate less. Inverted on purpose.
fu-max-unity = ["feature-unit"]



# DIAGNOSTIC (car board): generate a 1 kHz tone internally and deliberately swing
# the iso packet size 47/49 every frame. Answers "does Tesla tolerate variable
# packet sizes?" with no PCM2706, no source board, no wiring — flash, plug into
# the car, listen. Clean tone => Elastic pacing is safe. Never ship this.
packet-stress = []

[dependencies]
embassy-rp       = { version = "0.9", features = ["rp2040", "time-driver", "critical-section-impl", "unstable-pac"] }
embassy-usb      = { version = "0.6", default-features = false }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time     = { version = "0.5" }
embassy-futures  = { version = "0.1" }
embassy-sync     = { version = "0.7" }

cortex-m    = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
pio          = "0.3"
pio-proc     = "0.3"
fixed        = "1"
# RGB8, for the RP2040-Zero's onboard WS2812 (it has no plain LED).
smart-leds   = "0.4"

[profile.release]
opt-level     = "s"
lto           = "fat"
codegen-units = 1
debug         = 2
