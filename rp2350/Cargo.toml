# SPDX-License-Identifier: MIT
[package]
name    = "teslamic-rp2350"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Single-board TeslAux bridge on RP2350. Car on the native USB controller, phone on a PIO full-speed device port."

# Bring-up only: WS2812 on GPIO16, no USB, no PIO USB. Proves the chip port
# (thumbv8m, IMAGE_DEF, memory map) before anything is built on top of it.
[[bin]]
name = "ledtest"
path = "src/bin/ledtest.rs"

# Host-buildable dependencies. Keeping these out of the target-only block below
# is what lets `cargo test` run on the development machine: the PIO USB codec
# (NRZI, bit stuffing, CRC5/CRC16) is pure logic, and it is the only part of a
# driver like this that can be verified without a logic analyser. That is worth
# arranging the manifest around.
# Loopback self-test for the PIO USB line coding: TX drives D+/D-, the receive
# state machines read the same pads, and the LED reports pass or fail. No
# instruments required. See src/bin/pioloop.rs.
[[bin]]
name = "pioloop"
path = "src/bin/pioloop.rs"

# Logic analyser: samples D+/D- with a spare PIO block and dumps the waveform
# over the native USB port. For when the decoded bytes stop being informative.
[[bin]]
name = "piocap"
path = "src/bin/piocap.rs"

# Drives whole transactions against the device engine: the CPU plays host,
# the engine replies, and PIO2 captures both halves. See src/bin/piotxn.rs.
[[bin]]
name = "piotxn"
path = "src/bin/piotxn.rs"

# Stands the PIO port up as a real device so a computer can enumerate it. The
# first test with a host on the other end. See src/bin/pioenum.rs.
[[bin]]
name = "pioenum"
path = "src/bin/pioenum.rs"

[features]
default = ["board-usb-c"]
# Waveshare RP2350-USB-C: RP2350A, 2 MB flash, PIO USB on gp13/gp12 (measured).
board-usb-c = ["embassy-rp/rp235xa"]
# Waveshare RP2350-PiZero: RP2350B, 16 MB flash. The B part differs only in
# package and pin count — 48 GPIO against 30 — and the extra feature exists
# solely so PIN_30..PIN_47 are declared. Everything the driver touches is
# identical between the two.
board-pizero = ["embassy-rp/rp235xb"]

# Diagnostic: the start-of-packet handler only counts and clears the flag,
# running no transaction. Bisects "interrupt rarely raised" against "interrupt
# raised often but serviced slowly". See on_packet_start.
stub-irq = []

# Measures which GPIO carries the 1.5k device pull-up, so a new board's D+/D-
# come from the hardware rather than from a schematic. See src/bin/pinscan.rs.
[[bin]]
name = "pinscan"
path = "src/bin/pinscan.rs"

[dependencies]
pio      = "0.3"
pio-proc = "0.3"

# Chip dependencies, for the firmware target only. `cfg(target_os = "none")` is
# false on the host, so `cargo test` never tries to compile embassy-rp for macOS.
#
# `rp235xa` is the 60-pin part on the Waveshare RP2350-USB-C. embassy-rp emits
# the secure-exe IMAGE_DEF for us; memory.x only has to place `.start_block`.
[target.'cfg(target_os = "none")'.dependencies]
embassy-rp       = { version = "0.9", default-features = false, features = ["rt", "time-driver", "critical-section-impl", "unstable-pac"] }
embassy-usb      = { version = "0.6", default-features = false }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time     = { version = "0.5" }
embassy-futures  = { version = "0.1" }
embassy-sync     = { version = "0.7" }
embassy-usb-driver = { version = "0.2" }
critical-section = { version = "1" }

cortex-m    = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
fixed       = "1"
# RGB8, for the board's onboard WS2812 (GPIO16, same pin as the RP2040-Zero).
smart-leds  = "0.4"

[profile.release]
opt-level     = "s"
lto           = "fat"
codegen-units = 1
debug         = 2
