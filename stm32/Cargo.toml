# SPDX-License-Identifier: MIT
[package]
name    = "teslaux-stm32"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Single-chip TeslAux bridge: phone and car both attach to one STM32F407, no I2S link."

[[bin]]
name = "bridge"
path = "src/main.rs"

[features]
# Diagnostic only: bring up the car-facing port alone, leaving OTG_HS
# uninitialised, to test whether two OTG cores interfere.
car-only = []

# No other feature flags. The two-board build needs them because its cushion is a
# guess that different situations want sized differently; here the cushion is
# measured, so there is one configuration.

[dependencies]
# embassy-usb is the same 0.6 the RP2040 build uses, which is why
# `teslamic.rs` compiles here unchanged.
embassy-stm32    = { version = "0.6", features = ["stm32f407ve", "time-driver-any", "memory-x", "unstable-pac", "defmt"] }
embassy-usb      = { version = "0.6", default-features = false, features = ["defmt"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time     = { version = "0.5" }
embassy-futures  = { version = "0.1" }
embassy-sync     = { version = "0.7" }

cortex-m    = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
# Bring-up visibility over the ST-Link. Costs nothing when DEFMT_LOG is off.
defmt       = "1"
defmt-rtt   = "1"

cortex-m-rt = "0.7"

[profile.release]
opt-level     = "s"
lto           = true
debug         = 2
codegen-units = 1
