# SPDX-License-Identifier: MIT
[package]
name    = "teslaux-stm32"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Single-chip TeslAux bridge: phone and car both attach to one STM32F407, no I2S link."

[[bin]]
name = "bridge"
path = "src/main.rs"

[features]
# The car will not poll this build's isochronous endpoint without the
# sampling-frequency control: it STALLed the SET_CUR, cycled alt 1/0 three times
# and stopped asking for audio. `teslamic.rs` reads this feature, so it is on
# here and off on the RP2040, which never needed it.
default = ["sampling-freq-control"]
sampling-freq-control = []

# No other feature flags: the two-board build has them because its cushion is a
# guess that different situations want sized differently, while here it is
# measured, so there is one configuration.

[dependencies]
# embassy-usb is the same 0.6 the RP2040 build uses, which is why
# `teslamic.rs` compiles here unchanged.
# Pinned to git, not crates.io, for one specific reason: the published
# embassy-usb-synopsys-otg 0.3.3 reschedules missed isochronous IN packets on
# EOPF rather than on IISOIXFR. Against the car — which sets alt 1/0/1/0/1 in
# rapid succession, unlike any host that works — the IN endpoint stops being
# serviced after a few packets and never recovers. Upstream replaced that path
# on 2026-08-19, and it matches open issue #6935, "ISO IN endpoint becomes
# unavailable with embassy-usb-synopsys-otg".
embassy-stm32    = { git = "https://github.com/embassy-rs/embassy", features = ["stm32f407ve", "time-driver-any", "memory-x", "unstable-pac", "defmt"] }
embassy-usb      = { git = "https://github.com/embassy-rs/embassy", default-features = false, features = ["defmt"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", features = ["platform-cortex-m", "executor-thread"] }
embassy-time     = { git = "https://github.com/embassy-rs/embassy" }
embassy-futures  = { git = "https://github.com/embassy-rs/embassy" }
embassy-sync     = { git = "https://github.com/embassy-rs/embassy" }

cortex-m    = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
# Bring-up visibility over the ST-Link. Costs nothing when DEFMT_LOG is off.
defmt       = "1"
defmt-rtt   = "1"

cortex-m-rt = "0.7"

[profile.release]
opt-level     = "s"
lto           = true
debug         = 2
codegen-units = 1
